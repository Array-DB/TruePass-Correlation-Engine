name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --global typescript@5.8.3
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src/truepass
      - name: Unit and synthetic E2E tests
        run: pytest -q -m 'not postgres'
      - name: Compile smoke test
        run: python -m compileall -q src tests scripts
      - name: Typed frontend audit compile
        run: tsc -p frontend/tsconfig.json
      - name: Overall Definition of Done (source/runtime)
        run: truepass verify dod --no-external
      - name: Release verification
        run: python scripts/release_verify.py

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: truepass_test
          POSTGRES_USER: truepass
          POSTGRES_PASSWORD: truepass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truepass -d truepass_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TRUEPASS_TEST_DATABASE_URL: postgresql+psycopg://truepass:truepass@localhost:5432/truepass_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - name: PostgreSQL integration tests
        run: pytest -q -m postgres
      - name: Migration SQL generation
        run: alembic upgrade head --sql > /tmp/truepass-migration.sql

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip pip-audit
      - run: python -m pip install -e .
      - name: Dependency audit
        run: pip-audit
      - name: Ensure no committed environment file
        run: test ! -f .env

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: truepass:ci
