services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-truepass}
      POSTGRES_USER: ${POSTGRES_USER:-truepass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - truepass_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-truepass} -d ${POSTGRES_DB:-truepass}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true

  truepass:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TRUEPASS_DATABASE__URL: postgresql+psycopg://${POSTGRES_USER:-truepass}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-truepass}
      TRUEPASS_API_KEY: ${TRUEPASS_API_KEY:-}
    ports:
      - "${TRUEPASS_PORT:-8000}:8000"
    volumes:
      - truepass_data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v3.6.0
    restart: unless-stopped
    profiles: ["monitoring"]
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - truepass_prometheus:/prometheus
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    security_opt:
      - no-new-privileges:true

volumes:
  truepass_postgres:
  truepass_data:
  truepass_prometheus:
