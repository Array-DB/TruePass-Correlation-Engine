[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "truepass-correlation-engine"
version = "1.0.0"
description = "Defensive multimodal telemetry, anomaly detection, evidence preservation, and forensic correlation platform."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Array-DB"}]
keywords = ["cybersecurity", "incident-response", "forensics", "sdr", "telemetry", "correlation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
]

dependencies = [
  "alembic>=1.15,<2",
  "prometheus-client>=0.21,<1",
  "psutil>=6.1,<8",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "networkx>=3.4,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "cryptography>=46,<47",
  "fastapi>=0.128,<1",
  "uvicorn>=0.48,<1",
  "websockets>=15,<16",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0.36,<3",
]

[project.optional-dependencies]
hackrf = [] # SoapySDR/SoapyHackRF are system or conda packages, not PyPI runtime deps.
dev = [
  "mypy>=1.14,<2",
  "pre-commit>=4.0,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
truepass = "truepass.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/truepass"]

[tool.hatch.build.targets.wheel.force-include]
"src/truepass/dashboard/index.html" = "truepass/dashboard/index.html"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["postgres: requires a PostgreSQL test database"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
