<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <rect width="1400" height="800" fill="#0d1117"/>
  <text x="70" y="90" fill="#f0f6fc" font-size="42" font-family="Arial,Helvetica,sans-serif" font-weight="700">Correlation-First Incident Model</text>
  <text x="70" y="135" fill="#8b949e" font-size="22" font-family="Arial,Helvetica,sans-serif">Independent evidence increases confidence; correlation never automatically means causation.</text>
  <g font-family="Arial,Helvetica,sans-serif">
    <rect x="90" y="220" width="250" height="105" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="125" y="282" fill="#c9d1d9" font-size="25">RF anomaly</text>
    <rect x="90" y="370" width="250" height="105" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="125" y="432" fill="#c9d1d9" font-size="25">Wi-Fi change</text>
    <rect x="90" y="520" width="250" height="105" rx="16" fill="#161b22" stroke="#58a6ff" stroke-width="2"/><text x="125" y="582" fill="#c9d1d9" font-size="25">Process / socket</text>

    <rect x="515" y="305" width="370" height="240" rx="20" fill="#161b22" stroke="#d29922" stroke-width="3"/>
    <text x="565" y="365" fill="#d29922" font-size="30" font-weight="700">Correlation Engine</text>
    <text x="565" y="415" fill="#c9d1d9" font-size="22">• time proximity</text><text x="565" y="455" fill="#c9d1d9" font-size="22">• entity relationships</text><text x="565" y="495" fill="#c9d1d9" font-size="22">• baseline novelty</text>

    <rect x="1060" y="260" width="260" height="135" rx="18" fill="#161b22" stroke="#3fb950" stroke-width="3"/><text x="1105" y="315" fill="#3fb950" font-size="28" font-weight="700">Incident</text><text x="1105" y="355" fill="#c9d1d9" font-size="23">score + reasons</text>
    <rect x="1060" y="475" width="260" height="135" rx="18" fill="#161b22" stroke="#f778ba" stroke-width="3"/><text x="1105" y="530" fill="#f778ba" font-size="28" font-weight="700">Evidence</text><text x="1105" y="570" fill="#c9d1d9" font-size="23">IDs + integrity</text>

    <text x="390" y="430" fill="#8b949e" font-size="48">→</text><text x="940" y="430" fill="#8b949e" font-size="48">→</text>
  </g>
  <text x="70" y="715" fill="#f0f6fc" font-size="24" font-family="Arial,Helvetica,sans-serif" font-weight="700">Output wording:</text>
  <text x="265" y="715" fill="#c9d1d9" font-size="24" font-family="Arial,Helvetica,sans-serif">“High cross-domain correlation — investigate. Causation not established.”</text>
</svg>
