[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "truepass-correlation-engine"
version = "0.1.0"
description = "Defensive multimodal telemetry, anomaly detection, evidence preservation, and forensic correlation platform."
readme = "README.md"
requires-python = ">=3.13"
license = {text = "Apache-2.0"}
authors = [{name = "Array-DB"}]
keywords = ["cybersecurity", "incident-response", "forensics", "sdr", "telemetry", "correlation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Security",
]

dependencies = [
  "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/truepass"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
